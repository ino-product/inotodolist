<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e5dcd6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="自己的习惯打卡与待办清单"><title>习惯手记</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23a1addd'/%3E%3Cpath d='m9 16 5 5 9-11' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=20260922d"></head>
<body><div id="welcome" class="welcome" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle"><span class="welcome-credit" aria-label="Made by ino">Made by ino</span><button id="enterApp" class="welcome-enter" type="button" aria-label="进入习惯手记"><span class="welcome-brand">习惯手记</span><span class="stamp-scene" aria-hidden="true"><img class="notepaper-art" src="assets/notepaper.png" alt=""><img class="stamp-art" src="assets/stamp.png" alt=""><span class="stamp-shadow"></span></span><span id="welcomeTitle" class="welcome-title">今天，也为自己盖一枚章</span><span class="welcome-copy">点击印章，开始记录</span><span class="welcome-english">TAP TO BEGIN</span></button></div><div class="app"><header><div class="top-menu" id="topMenu"><button id="more" aria-label="更多功能" aria-expanded="false" title="更多功能">⋯</button><div id="moreMenu" class="more-menu" hidden><button id="openGuide" type="button">使用指南</button><button id="openData" type="button">数据管理</button></div></div><nav aria-label="页面"><button class="tab" data-view="todo">清单</button><i></i><button class="tab active" data-view="habits">打卡</button><i></i><button id="weekButton" aria-label="选择日期">9月 <span class="triangle"></span></button></nav></header><main id="main"></main></div>
<dialog id="editor"><form id="editForm"><div class="dialog-heading"><h2 id="editTitle">添加习惯</h2><button type="button" class="close" aria-label="关闭">×</button></div><label for="name">名称</label><input id="name" maxlength="24" required autocomplete="off" placeholder="想养成什么习惯？"><fieldset id="colors"><legend>标记颜色</legend><div class="swatches"></div></fieldset><div class="actions"><button type="button" id="delete" class="text-button">删除习惯</button><button class="save" type="submit">保存</button></div></form></dialog>
<dialog id="dataDialog"><div class="dialog-heading"><h2>数据管理</h2><button type="button" class="close" aria-label="关闭">×</button></div><p class="data-copy">备份会下载当前习惯、打卡记录、待办和自定义颜色。导入备份会替换此浏览器中的现有数据。</p><div class="data-actions"><button id="exportData" type="button" class="save">导出备份</button><button id="importData" type="button" class="outline-button">导入备份</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></dialog><dialog id="weekDialog"><div class="dialog-heading"><h2>选择一周</h2><button class="close" aria-label="关闭">×</button></div><div class="week-nav"><button id="prev" aria-label="上一周">‹</button><span id="range"></span><button id="next" aria-label="下一周">›</button></div><label for="date">跳转到日期</label><input type="date" id="date"><button id="thisWeek" class="save wide">回到本周</button></dialog><dialog id="guide" aria-labelledby="guideTitle"><div class="guide-top"><span id="guideProgress"></span><button id="guideSkip" class="text-button" type="button">稍后再看</button></div><h2 id="guideTitle"></h2><p id="guideText"></p><p id="guideHint"></p><div class="actions"><button id="guideBack" class="text-button" type="button">上一步</button><button id="guideNext" class="save" type="button">下一步</button></div></dialog><div role="status" id="toast"></div><script src="app.js"></script></body></html>
